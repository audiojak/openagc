[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/audiojak/openagc"
publish = false

[workspace.dependencies]
# Internal crates. Dependency direction is enforced by `cargo xtask check-deps`.
mail-domain = { path = "crates/mail-domain" }
mail-store = { path = "crates/mail-store" }
mail-mime = { path = "crates/mail-mime" }
mail-sync = { path = "crates/mail-sync" }
provider-api = { path = "crates/provider-api" }
provider-gmail = { path = "crates/provider-gmail" }
agent-api = { path = "crates/agent-api" }
agent-claude = { path = "crates/agent-claude" }
agent-codex = { path = "crates/agent-codex" }
agent-mcp = { path = "crates/agent-mcp" }
permissions = { path = "crates/permissions" }
openagc-core = { path = "crates/openagc-core" }

# External crates.
uniffi = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs", "signal"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
