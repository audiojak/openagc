[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/audiojak/openagc"
publish = false

[workspace.dependencies]
# Internal crates. Dependency direction is enforced by `cargo xtask check-deps`.
mail-domain = { path = "crates/mail-domain" }
mail-store = { path = "crates/mail-store" }
mail-mime = { path = "crates/mail-mime" }
mail-sync = { path = "crates/mail-sync" }
provider-api = { path = "crates/provider-api" }
provider-gmail = { path = "crates/provider-gmail" }
agent-api = { path = "crates/agent-api" }
agent-claude = { path = "crates/agent-claude" }
agent-codex = { path = "crates/agent-codex" }
agent-mcp = { path = "crates/agent-mcp" }
permissions = { path = "crates/permissions" }
openagc-core = { path = "crates/openagc-core" }

# External crates.
uniffi = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs", "signal"] }
thiserror = "2"
# trace is compiled out of release builds: it is the only level allowed to carry mail content.
tracing = { version = "0.1", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
mail-parser = "0.11"
mail-builder = "1"
ammonia = "4"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "http2", "charset"] }
fastrand = "2"
base64 = "0.22"
futures = "0.3"
sha2 = "0.10"
getrandom = "0.3"
url = "2"
wiremock = "0.6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
insta = "1"
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
