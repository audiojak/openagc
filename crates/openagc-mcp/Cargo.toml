[package]
name = "openagc-mcp"
description = "Stateless MCP stdio shim that forwards agent tool calls to the OpenAGC core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-mcp.workspace = true
rmcp.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-std"] }

[dev-dependencies]
async-trait.workspace = true
permissions.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time"] }

[lints]
workspace = true
