[package]
name = "provider-gmail"
description = "Gmail REST client and OAuth desktop flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The in-process fake IMAP server, for other crates' tests.
fake-imap = []

[dependencies]
async-imap.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
mail-domain.workspace = true
mail-mime.workspace = true
provider-api.workspace = true
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
getrandom.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync"] }

[dev-dependencies]
provider-gmail = { path = ".", features = ["fake-imap"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
