# cargo-deny configuration. Run: cargo deny check

[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# OpenAGC is MIT; dependencies must be compatible with MIT distribution.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
