name: OpenAGC
options:
  bundleIdPrefix: ai.actual
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  # Pinned by revision (spec §16 supply chain): Sparkle 2.10.0.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: eef1a539a373c1f1a320624b1130fc5de7b2e100
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Apple Silicon only: the Rust core is built for aarch64 (spec §14.1).
    ARCHS: arm64
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    OPENAGC_ENTITLEMENTS: OpenAGC/Resources/OpenAGC.entitlements
    # Rust core artifacts written by scripts/build-core.sh (spec §4.1).
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/../build/core/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/../build/core/lib
targets:
  OpenAGCCore:
    # Debug builds may sign with a stable development identity
    # (scripts/dev-signing.sh); Local.xcconfig is gitignored and may be empty.
    configFiles:
      Debug: Local.xcconfig
    type: framework.static
    platform: macOS
    sources:
      - path: ../build/core/swift/openagc_core.swift
        optional: true
    preBuildScripts:
      - name: Build Rust core
        script: '"$SRCROOT/../scripts/build-core.sh"'
        basedOnDependencyAnalysis: false   # always run; cargo decides what to rebuild
        showEnvVars: false
        outputFiles:
          - $(SRCROOT)/../build/core/swift/openagc_core.swift
          - $(SRCROOT)/../build/core/include/openagc_coreFFI.h
          - $(SRCROOT)/../build/core/include/module.modulemap
          - $(SRCROOT)/../build/core/lib/libopenagc_core.a
          - $(SRCROOT)/../build/core/bin/openagc-mcp
    settings:
      base:
        # The script writes outside the build directory and runs cargo.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: ai.actual.openagc.core
        PRODUCT_NAME: OpenAGCCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # Generated code predates strict concurrency; keep it quiet here only.
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
  OpenAGC:
    # Debug builds may sign with a stable development identity
    # (scripts/dev-signing.sh); Local.xcconfig is gitignored and may be empty.
    configFiles:
      Debug: Local.xcconfig
    type: application
    platform: macOS
    sources:
      - path: OpenAGC
    dependencies:
      - target: OpenAGCCore
      - package: Sparkle
    postCompileScripts:
      - name: Embed openagc-mcp
        # Agent CLIs spawn <app>/Contents/MacOS/openagc-mcp (spec §10.1).
        script: |
          install -m 0755 "$SRCROOT/../build/core/bin/openagc-mcp" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/openagc-mcp"
        inputFiles:
          - $(SRCROOT)/../build/core/bin/openagc-mcp
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/openagc-mcp
    info:
      path: OpenAGC/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Sparkle compares this; release.yml sets it to the build number.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle (spec §16). One appcast on main lists every release; betas
        # carry the "beta" channel (scripts/make-appcast.sh).
        SUFeedURL: https://raw.githubusercontent.com/audiojak/openagc/main/appcast.xml
        # Set by the release maintainer (docs/releasing.md). Empty disables
        # the updater, so development builds never check for updates.
        SUPublicEDKey: 7MkOQ+3AXyPMrh8zri1P40oRXY3+8FAui3b/B5xBcfE=
        SUEnableInstallerLauncherService: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.actual.openagc
        PRODUCT_NAME: OpenAGC
        OTHER_LDFLAGS: -lopenagc_core
        ENABLE_HARDENED_RUNTIME: YES
        # Indirect so Local.xcconfig (dev signing) can swap the file.
        CODE_SIGN_ENTITLEMENTS: $(OPENAGC_ENTITLEMENTS)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: OpenAGC/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: OpenAGC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Actual AI and the OpenAGC contributors. MIT License."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OpenAGCTests:
    # Debug builds may sign with a stable development identity
    # (scripts/dev-signing.sh); Local.xcconfig is gitignored and may be empty.
    configFiles:
      Debug: Local.xcconfig
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenAGCTests
    dependencies:
      - target: OpenAGC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.actual.openagc.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenAGC.app/Contents/MacOS/OpenAGC"
schemes:
  OpenAGC:
    build:
      targets:
        OpenAGC: all
        OpenAGCTests: [test]
    test:
      targets:
        - OpenAGCTests
      gatherCoverageData: false
