name: OpenAGC
options:
  bundleIdPrefix: ai.actual
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    # Rust core artifacts written by scripts/build-core.sh (spec §4.1).
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/../build/core/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/../build/core/lib
targets:
  OpenAGCCore:
    type: framework.static
    platform: macOS
    sources:
      - path: ../build/core/swift/openagc_core.swift
        optional: true
    preBuildScripts:
      - name: Build Rust core
        script: '"$SRCROOT/../scripts/build-core.sh"'
        basedOnDependencyAnalysis: false   # always run; cargo decides what to rebuild
        showEnvVars: false
        outputFiles:
          - $(SRCROOT)/../build/core/swift/openagc_core.swift
          - $(SRCROOT)/../build/core/include/openagc_coreFFI.h
          - $(SRCROOT)/../build/core/include/module.modulemap
          - $(SRCROOT)/../build/core/lib/libopenagc_core.a
    settings:
      base:
        # The script writes outside the build directory and runs cargo.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: ai.actual.openagc.core
        PRODUCT_NAME: OpenAGCCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # Generated code predates strict concurrency; keep it quiet here only.
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
  OpenAGC:
    type: application
    platform: macOS
    sources:
      - path: OpenAGC
    dependencies:
      - target: OpenAGCCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.actual.openagc
        PRODUCT_NAME: OpenAGC
        OTHER_LDFLAGS: -lopenagc_core
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: OpenAGC/Resources/OpenAGC.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenAGC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Actual AI and the OpenAGC contributors. MIT License."
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  OpenAGCTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenAGCTests
    dependencies:
      - target: OpenAGC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.actual.openagc.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenAGC.app/Contents/MacOS/OpenAGC"
schemes:
  OpenAGC:
    build:
      targets:
        OpenAGC: all
        OpenAGCTests: [test]
    test:
      targets:
        - OpenAGCTests
      gatherCoverageData: false
